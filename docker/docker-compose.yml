services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: citerator-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: citerator-api
    depends_on:
      - qdrant
    env_file:
      - ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ../data/raw:/app/data/raw
      - ../data/processed:/app/data/processed
      - ../eval:/app/eval
    restart: unless-stopped

volumes:
  qdrant_storage:
